# This is a Declarative Automation Bundle definition for citibike.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: citibike
  uuid: d10a9b8d-f84a-443d-9190-f19fd6e68683

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b97854eb-76f9.cloud.databricks.com
    variables:
      catalog: citibike_dev
      schema: dev
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-b97854eb-76f9.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/kadarferi@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/kadarferi@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: citibike_prod
      schema: prod
    permissions:
      - user_name: kadarferi@gmail.com
        level: CAN_MANAGE
